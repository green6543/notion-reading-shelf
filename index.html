<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>다독 책장 · 독서 달력</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif; }
  body { background: #fff; color: #222; padding: 16px; font-size: 12px; line-height: 1.45; }
  .wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .toolbar, .controls, .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .toolbar, .row { justify-content: space-between; }
  .toolbar { padding-bottom: 10px; border-bottom: 1px solid #eee; }
  select, button, input { border: 1px solid #ddd; background: #fff; color: #222; padding: 5px 10px; border-radius: 4px; font-size: 12px; }
  select, button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  input { width: 72px; }
  input, select { accent-color: #222; color-scheme: light; }
  :focus-visible { outline: 2px solid #222; outline-offset: 1px; }
  .muted { color: #777; font-size: 11px; }
  .message { padding: 9px 12px; border-radius: 6px; background: #f4f4f4; border: 1px solid #222; color: #222; }
  .box { border: 1px solid #eee; border-radius: 6px; padding: 12px; }
  .title { font-weight: 600; }
  .goal-number { font-size: 22px; font-weight: 700; margin: 6px 0; }
  .track { height: 10px; background: #eeeeee; border-radius: 5px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: #222222; transition: width .3s; }
  .pace { margin-top: 7px; color: #444; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .stat { border: 1px solid #eee; background: #fafafa; border-radius: 6px; padding: 9px 12px; }
  .stat b { display: block; font-size: 15px; }
  .months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-top: 10px; }
  .month { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 90px; font-size: 10px; color: #777; }
  .month i { width: 70%; background: #8a8a8a; border-radius: 3px 3px 0 0; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 12px; border: 1px solid #e2e2e2; }
  .tabs button.active { background: #222; border-color: #222; color: #fff; }
  .shelf { display: flex; flex-direction: column; gap: 16px; padding-top: 12px; overflow-x: auto; }
  .spines { display: flex; align-items: flex-end; gap: 2px; padding: 6px 8px 0; min-height: 145px; }
  .spine { display: flex; flex: none; align-items: center; justify-content: center; padding: 6px 0; border: 0; border-radius: 3px 3px 0 0; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.6); transition: transform .15s; overflow: hidden; }
  .spine:hover { transform: translateY(-5px); }
  .spine span { writing-mode: vertical-rl; text-orientation: mixed; max-height: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 10px; }
  .plank { height: 7px; background: #d6d6d6; border-radius: 2px; margin-top: 1px; }
  .detail { margin-top: 10px; color: #555; white-space: pre-line; }
  .calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; margin-top: 10px; }
  .dow { text-align: center; color: #777; font-size: 11px; }
  .day { min-height: 68px; border: 1px solid #f2f2f2; border-radius: 4px; padding: 4px 2px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .day.empty { border-color: transparent; }
  .day.today { border-color: #888; }
  .bar { border: 0; text-align: left; font-size: 10px; padding: 2px 4px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 0; color: #222; flex: none; }
  .bar.start { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
  .bar.end { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <div class="controls">
      <label for="year">연도</label><select id="year"></select>
      <label for="month">달력 월</label><select id="month"></select>
    </div>
    <div class="controls">
      <span class="muted" id="updated" aria-live="polite"></span>
      <button id="reload" type="button">데이터 새로고침</button>
    </div>
  </div>
  <div class="message" id="message" role="alert" hidden></div>

  <section class="box">
    <div class="row">
      <span class="title" id="goalTitle">다독 목표</span>
      <label class="muted">목표 <input id="goal" type="number" min="1" max="1000" step="1"> 권</label>
    </div>
    <div class="goal-number" id="goalNumber">-</div>
    <div class="track"><div class="fill" id="goalFill"></div></div>
    <div class="pace" id="pace"></div>
  </section>

  <div class="stats" id="stats"></div>

  <section class="box">
    <div class="title">월별 완독 권수</div>
    <div class="months" id="months"></div>
    <div class="pills" id="genres"></div>
  </section>

  <section class="box">
    <div class="row">
      <span class="title">책장</span>
      <div class="controls tabs" id="tabs"></div>
    </div>
    <div class="shelf" id="shelf"></div>
    <div class="detail" id="detail" aria-live="polite">책을 클릭하면 상세 정보가 표시됩니다.</div>
  </section>

  <section class="box">
    <div class="title" id="calendarTitle">독서 달력</div>
    <div class="calendar" id="calendar"></div>
  </section>
</div>

<script>
  const DEFAULT_GOAL = 50;
  const STATUSES = ["완독", "읽는 중", "읽을 예정", "하차"];
  const GENRE_COLORS = { "소설": "#333333", "인문": "#666666" };
  const PALETTE = ["#222222", "#444444", "#555555", "#6e6e6e", "#7d7d7d"];

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const colorCache = new Map();
  const goals = {};
  let books = [];
  let tab = "완독";
  let loaded = false;
  let renderId = 0;

  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const doneDate = b => b.dateEnd || b.dateStart;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function baseColor(book) {
    if (GENRE_COLORS[book.genre]) return GENRE_COLORS[book.genre];
    let hash = 0;
    for (const ch of book.genre || book.title) hash = (hash * 31 + ch.codePointAt(0)) >>> 0;
    return PALETTE[hash % PALETTE.length];
  }

  function rgba(color, alpha) {
    let rgb;
    if (color.startsWith("#")) rgb = [1, 3, 5].map(i => parseInt(color.slice(i, i + 2), 16));
    else rgb = color.match(/\d+/g).slice(0, 3);
    return `rgba(${rgb.join(",")},${alpha})`;
  }

  // 표지 가장자리 색 추출. 이미지 서버가 막으면 장르 색을 사용
  function coverColor(book) {
    const fallback = baseColor(book);
    if (!book.cover) return Promise.resolve(fallback);
    const key = book.cover + fallback;
    if (!colorCache.has(key)) {
      colorCache.set(key, new Promise(resolve => {
        const img = new Image();
        const timer = setTimeout(() => resolve(fallback), 4000);
        const done = color => { clearTimeout(timer); resolve(color); };
        img.crossOrigin = "anonymous";
        img.onerror = () => done(fallback);
        img.onload = () => {
          try {
            const size = 24;
            const canvas = el("canvas");
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, size, size);
            const data = ctx.getImageData(0, 0, size, size).data;
            const sum = [0, 0, 0];
            let count = 0;
            for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
              if (x && y && x < size - 1 && y < size - 1) continue;
              const i = (y * size + x) * 4;
              if (data[i + 3] < 20) continue;
              for (let c = 0; c < 3; c++) sum[c] += data[i + c];
              count++;
            }
            done(count ? `rgb(${sum.map(v => Math.round(v / count)).join(",")})` : fallback);
          } catch { done(fallback); }
        };
        img.src = book.cover;
      }));
    }
    return colorCache.get(key);
  }

  // 목표: 직접 입력 > 주소의 ?goal= > 이 브라우저에 저장한 값 > 기본값
  function getGoal(year) {
    if (goals[year]) return goals[year];
    const fromUrl = Math.floor(Number(params.get("goal")));
    if (fromUrl > 0) return fromUrl;
    try {
      const saved = Number(localStorage.getItem(`readingGoal-${year}`));
      if (saved > 0) return saved;
    } catch {}
    return DEFAULT_GOAL;
  }

  const completedIn = year => books.filter(b =>
    b.status === "완독" && doneDate(b) && (year === "ALL" || doneDate(b).startsWith(year)));

  function selectedYear() { return $("year").value; }
  function goalYear() {
    return selectedYear() === "ALL" ? String(new Date().getFullYear()) : selectedYear();
  }

  function renderGoal() {
    const year = goalYear();
    const goal = getGoal(year);
    const count = completedIn(year).length;
    $("goalTitle").textContent = `${year}년 다독 목표`;
    if (document.activeElement !== $("goal")) $("goal").value = goal;
    if (!loaded) return;

    const percent = Math.round(count / goal * 100);
    $("goalNumber").textContent = `${count} / ${goal}권 (${percent}%)`;
    $("goalFill").style.width = `${Math.min(100, percent)}%`;

    const now = new Date();
    const thisYear = now.getFullYear();
    const y = Number(year);
    const left = Math.max(0, goal - count);
    const totalDays = (Date.UTC(y + 1, 0, 1) - Date.UTC(y, 0, 1)) / 86400000;
    let text;

    if (!left) text = "목표를 달성했어요!";
    else if (y < thisYear) text = `목표까지 ${left}권이 남은 채 마감했어요.`;
    else if (y > thisYear) text = `시작 전 · 한 달에 약 ${(goal / 12).toFixed(1)}권, ${(totalDays / goal).toFixed(1)}일에 1권 속도예요.`;
    else {
      const dayOfYear = (Date.UTC(y, now.getMonth(), now.getDate()) - Date.UTC(y, 0, 1)) / 86400000 + 1;
      const expected = Math.floor(goal * dayOfYear / totalDays);
      const diff = count - expected;
      const daysLeft = totalDays - dayOfYear + 1; // 오늘 포함
      const status = diff > 0 ? `계획보다 ${diff}권 앞서요` : diff < 0 ? `계획보다 ${-diff}권 뒤예요` : "계획대로예요";
      text = `${status} · 오늘 포함 ${daysLeft}일 동안 ${left}권 (${left > daysLeft ? `하루 약 ${(left / daysLeft).toFixed(1)}권` : `약 ${(daysLeft / left).toFixed(1)}일에 1권`})`;
    }
    $("pace").textContent = text;
  }

  function renderStats() {
    const year = selectedYear();
    const done = completedIn(year);
    const pages = done.reduce((sum, b) => sum + b.pages, 0);
    const now = new Date();
    const thisMonth = completedIn("ALL").filter(b => doneDate(b).startsWith(iso(now).slice(0, 7))).length;
    const items = [
      [year === "ALL" ? "전체 완독" : `${year}년 완독`, `${done.length}권`],
      ["완독 페이지", `${pages.toLocaleString()}쪽`],
      ["이번 달 완독", `${thisMonth}권`],
      ["읽는 중 / 읽을 예정", `${books.filter(b => b.status === "읽는 중").length} / ${books.filter(b => b.status === "읽을 예정").length}권`]
    ];
    $("stats").replaceChildren(...items.map(([label, value]) => {
      const card = el("div", "stat");
      card.append(el("span", "muted", label), el("b", "", value));
      return card;
    }));

    const counts = Array(12).fill(0);
    done.forEach(b => counts[Number(doneDate(b).slice(5, 7)) - 1]++);
    const max = Math.max(1, ...counts);
    $("months").replaceChildren(...counts.map((count, i) => {
      const col = el("div", "month");
      const bar = el("i");
      bar.style.height = `${count / max * 56}px`;
      col.append(el("span", "", count ? String(count) : ""), bar, el("span", "", `${i + 1}월`));
      return col;
    }));

    const genres = {};
    done.forEach(b => genres[b.genre || "장르 미입력"] = (genres[b.genre || "장르 미입력"] || 0) + 1);
    $("genres").replaceChildren(...Object.entries(genres).sort((a, b) => b[1] - a[1])
      .map(([name, count]) => el("span", "pill", `${name} ${count}권`)));
  }

  function showDetail(b) {
    const period = !doneDate(b) ? "날짜 미입력"
      : b.dateEnd && b.dateEnd !== b.dateStart ? `${b.dateStart} ~ ${b.dateEnd}` : b.dateStart;
    const lines = [
      `${b.title}${b.author ? ` · ${b.author}` : ""}`,
      [b.status || "상태 미입력", b.genre, b.pages ? `${b.pages}쪽` : "", b.rating ? `평점 ${b.rating}` : "", period].filter(Boolean).join(" | ")
    ];
    if (b.memo) lines.push(`메모: ${b.memo}`);
    if (b.quoteCount) lines.push(`연결된 문장 ${b.quoteCount}${b.quoteHasMore ? "+" : ""}개`);
    $("detail").textContent = lines.join("\n");
  }

  async function renderShelf() {
    const myId = ++renderId;
    const year = selectedYear();
    const listFor = status => status === "완독" ? completedIn(year) : books.filter(b => b.status === status);

    $("tabs").replaceChildren(...STATUSES.map(status => {
      const button = el("button", status === tab ? "active" : "", `${status} ${listFor(status).length}`);
      button.type = "button";
      button.setAttribute("aria-pressed", String(status === tab));
      button.onclick = () => { tab = status; renderShelf(); };
      return button;
    }));

    const list = [...listFor(tab)].sort((a, b) => (doneDate(a) || "9").localeCompare(doneDate(b) || "9"));
    const colors = await Promise.all(list.map(coverColor));
    if (myId !== renderId) return;
    $("shelf").replaceChildren();
    if (!list.length) {
      $("shelf").append(el("div", "muted", loaded ? "표시할 책이 없습니다." : "데이터를 불러오지 못했습니다."));
      return;
    }
    for (let i = 0; i < list.length; i += 16) {
      const row = el("div");
      const spines = el("div", "spines");
      let width = 16;
      list.slice(i, i + 16).forEach((book, j) => {
        const w = Math.max(22, Math.min(44, Math.round((book.pages || 240) / 12)));
        width += w + 2;
        const spine = el("button", "spine");
        spine.type = "button";
        spine.title = book.title;
        spine.style.width = `${w}px`;
        spine.style.height = `${118 + [...book.title].reduce((s, c) => s + c.codePointAt(0), 0) % 22}px`;
        spine.style.background = colors[i + j];
        spine.append(el("span", "", book.title));
        spine.onclick = () => showDetail(book);
        spines.append(spine);
      });
      const plank = el("div", "plank");
      plank.style.width = `${Math.max(120, width)}px`;
      row.append(spines, plank);
      $("shelf").append(row);
    }
  }

  function renderCalendar() {
    const year = Number(goalYear());
    const month = Number($("month").value);
    const lastDay = new Date(year, month + 1, 0).getDate();
    const offset = new Date(year, month, 1).getDay();
    const today = iso(new Date());
    $("calendarTitle").textContent = `${year}년 ${month + 1}월 독서 달력`;

    const spans = books.filter(b => b.status !== "읽을 예정").map(b => {
      const start = b.dateStart;
      let end = b.dateEnd || b.dateStart;
      // 읽는 중이고 종료일이 없으면 오늘까지 표시
      if (b.status === "읽는 중" && !b.dateEnd && start && start < today) end = today;
      return { book: b, start, end };
    }).filter(s => s.start).sort((a, b) => a.start.localeCompare(b.start));

    const nodes = ["일", "월", "화", "수", "목", "금", "토"].map(d => el("div", "dow", d));
    for (let i = 0; i < offset; i++) nodes.push(el("div", "day empty"));
    for (let day = 1; day <= lastDay; day++) {
      const date = `${year}-${pad(month + 1)}-${pad(day)}`;
      const cell = el("div", date === today ? "day today" : "day");
      cell.append(el("div", "muted", String(day)));
      const active = spans.filter(s => s.start <= date && date <= s.end);
      active.slice(0, 3).forEach(s => {
        const showName = date === s.start || day === 1 || (offset + day - 1) % 7 === 0;
        const bar = el("button", "bar", showName ? s.book.title : "\u00a0");
        if (date === s.start) bar.classList.add("start");
        if (date === s.end) bar.classList.add("end");
        const color = baseColor(s.book);
        bar.type = "button";
        bar.title = s.book.title;
        bar.setAttribute("aria-label", `${date} ${s.book.title}`);
        bar.style.background = rgba(color, .18);
        bar.style.borderBottom = `2px solid ${rgba(color, .8)}`;
        bar.onclick = () => showDetail(s.book);
        cell.append(bar);
        // 표지 색을 추출하면 형광펜 색도 교체
        coverColor(s.book).then(c => {
          bar.style.background = rgba(c, .18);
          bar.style.borderBottomColor = rgba(c, .8);
        });
      });
      if (active.length > 3) {
        const more = el("button", "bar", `+${active.length - 3}`);
        more.type = "button";
        more.onclick = () => { $("detail").textContent = `${date}\n${active.map(s => s.book.title).join("\n")}`; };
        cell.append(more);
      }
      nodes.push(cell);
    }
    $("calendar").replaceChildren(...nodes);
  }

  function renderAll() {
    renderGoal();
    if (loaded) renderStats();
    renderCalendar();
    renderShelf();
  }

  function fillYears() {
    const current = new Date().getFullYear();
    const years = [...new Set([String(current), String(current + 1),
      ...books.map(b => doneDate(b).slice(0, 4)).filter(Boolean)])].sort().reverse();
    const previous = selectedYear() || params.get("year");
    $("year").replaceChildren(new Option("전체 연도", "ALL"), ...years.map(y => new Option(`${y}년`, y)));
    $("year").value = previous === "ALL" || years.includes(previous) ? previous : String(current);
  }

  function showMessage(text) {
    $("message").textContent = text;
    $("message").hidden = !text;
  }

  async function loadData() {
    $("reload").disabled = true;
    $("reload").textContent = "불러오는 중…";
    try {
      const res = await fetch(`/api/reading-data?t=${Date.now()}`, {
        cache: "no-store", signal: AbortSignal.timeout(20000)
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !Array.isArray(data?.books)) {
        throw new Error(data?.error || (res.status === 404
          ? "API를 찾지 못했습니다. 파일 위치가 api/reading-data.js인지 확인하세요."
          : `API 응답이 올바르지 않습니다 (HTTP ${res.status}). 접속 주소와 Vercel Logs를 확인하세요.`));
      }
      books = data.books;
      loaded = true;
      $("detail").textContent = "책을 클릭하면 상세 정보가 표시됩니다.";
      $("updated").textContent = `${new Date().toLocaleTimeString("ko-KR")} 갱신 · ${books.length}권`;
      const noDate = books.filter(b => b.status === "완독" && !doneDate(b)).length;
      const noStatus = books.filter(b => !b.status).length;
      showMessage([
        !books.length ? "연결됐지만 제목이 입력된 책이 없습니다." : "",
        noDate ? `완독인데 Date가 없는 책 ${noDate}권은 집계에서 빠집니다.` : "",
        noStatus ? `Status가 빈 책 ${noStatus}권은 집계에서 빠집니다.` : ""
      ].filter(Boolean).join(" "));
    } catch (error) {
      const reason = error.name === "TimeoutError" ? "응답 시간이 초과됐습니다."
        : error instanceof TypeError ? "네트워크 연결 또는 접속 권한을 확인하세요." : error.message;
      showMessage(`새로고침 실패: ${reason}${loaded ? " (이전에 불러온 데이터를 표시 중)" : ""}`);
    } finally {
      $("reload").disabled = false;
      $("reload").textContent = "데이터 새로고침";
      fillYears();
      renderAll();
    }
  }

  for (let m = 0; m < 12; m++) $("month").add(new Option(`${m + 1}월`, m));
  $("month").value = new Date().getMonth();
  fillYears();
  $("year").onchange = renderAll;
  $("month").onchange = renderCalendar;
  $("goal").onchange = () => {
    const value = Math.min(1000, Math.floor(Number($("goal").value)));
    if (value > 0) {
      goals[goalYear()] = value;
      try { localStorage.setItem(`readingGoal-${goalYear()}`, value); } catch {}
    }
    $("goal").blur();
    $("goal").value = getGoal(goalYear());
    renderGoal();
  };
  $("reload").onclick = loadData;
  loadData();
</script>
</body>
</html>
